
services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: backend_development
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    command: >
      sh -c "
        bundle install --jobs 4 --retry 3 &&
        bundle exec whenever --update-crontab &&
        cron &&
        rm -f tmp/pids/server.pid &&
        service cron start &&
        bundle exec rails db:prepare &&
        bundle exec rails server -p 3001 -b '0.0.0.0'
      "
    volumes:
      - ./backend:/rails
    working_dir: /rails
    ports:
      - "3001:3001"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/backend_development
      GOOGLE_APPLICATION_CREDENTIALS: /rails/config/credential/digest-with-ai-54977c53d6a2.json
      RAILS_ENV: development
      OPENAI_API_KEY_PATH: /rails/config/credential/openai_news_generation_api_key.txt

  frontend:
    build: ./frontend
    command: sh -c "CHOKIDAR_USEPOLLING=true npm run dev"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
